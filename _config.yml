title: "F9XR Articles"
author: "F9XR Editorial Team"
description: "Engineering digital growth — insights on web architecture, AI integration, local SEO, and high-performance digital systems from the F9XR Team."
keywords: "F9XR, F9XR Team, web architecture, AI integration, local SEO, digital growth, web performance, technical SEO, digital architecture, engineering digital growth"
twitter_username: "f9xrteam"
twitter:
  username: "f9xrteam"
  card: "summary_large_image"
url: "https://f9xr.github.io"
baseurl: "/articles"
email: "tontufytservices@gmail.com"
google_analytics: "G-134PMTPP82"
google_tagmanager: "GT-WKXBQKVL"
github_username: "f9xr"
linkedin_username: "f9xrteam"
instagram_username: "f9xrteam"
threads_username: "f9xrteam"
youtube_username: "QuarterlyLIV"
pinterest_username: "f9xr"
facebook_username: "f9xrteam"

lang: "en"
locale: "en_US"

theme: "minima"

rss: rss

kramdown:
  syntax_highlighter_opts:
    disable: true

markdown: kramdown
permalink: /:categories/:year/:month/:day/:title.html
encoding: UTF-8
lsi: true

collections:
  episodes:
    output: true
    permalink: /episodes/:title.html

plugins:
  - jekyll-feed
  - jekyll-sitemap

titles_from_headings:
  strip_title: true
  collections: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      tags: Other
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: episodes
    values:
      layout: episode

exclude:
  - README.md
  - AGENTS.md
  - CNAME
  - .git
  - .github
  - .vscode
  - .opencode
  - tools
  - tools/node_modules
  - tools/package.json
  - tools/package-lock.json
  - package-lock.json
  - package.json
  - article-urls.txt
  - all-urls.txt
  - Gemfile
  - Gemfile.lock
  - skills
  - mindmap-skill.skill
  - content-plan.md
  - DESIGN.md
  - seo_audit_report.md
  - google_discover_audit_report.md
  - seo_image_audit_report.md
  - bharat-by-day.html
  - f9xr-content-plan-mindmap.html
  - todo.txt
  - prompt.txt
  - css/override.css
