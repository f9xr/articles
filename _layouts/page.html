---
layout: default
---
<article class="post">
  {%- unless page.title_hidden -%}
  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">{{ page.title | escape }}</h1>
    <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>
  </header>
  {%- endunless -%}

  <div class="post-content e-content" itemprop="mainContentOfPage">
    {{ content }}
  </div>
</article>
