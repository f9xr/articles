<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}" dir="ltr">

  {%- include head.html -%}

  <body>

    <a href="#main-content" class="skip-link">Skip to main content</a>

    {%- include header.html -%}

    <div id="searchSection" role="search" aria-label="Site search" style="display:none; padding:1em 0;">
      <div class="wrapper">
        {% include search.html %}
      </div>
    </div>

    <main id="main-content" class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    <script>
    function toggleSearch() {
      var el = document.getElementById('searchSection');
      if (el.style.display === 'none' || el.style.display === '') {
        el.style.display = 'block';
        var input = document.getElementById('searchInput');
        if (input) { input.focus(); }
      } else {
        el.style.display = 'none';
      }
    }

    // Keyboard shortcut: "/" or Ctrl+K to toggle search
    document.addEventListener('keydown', function(e) {
      var active = document.activeElement;
      var typing = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable);
      var slash = e.key === '/' && !typing;
      var ctrlK = (e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K');
      if (slash || ctrlK) {
        e.preventDefault();
        toggleSearch();
      }
    });
    </script>

    <script>
    // Wrap tables in a scrollable container so wide tables don't break mobile layouts
    (function() {
      function wrapTables() {
        document.querySelectorAll('.post-content table').forEach(function(t) {
          if (t.closest('.table-scroll')) return;
          var wrap = document.createElement('div');
          wrap.className = 'table-scroll';
          t.parentNode.insertBefore(wrap, t);
          wrap.appendChild(t);
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', wrapTables);
      } else {
        wrapTables();
      }
    })();
    </script>

    {%- include footer.html -%}

    <noscript>
      <style>
        .post-toolbar, .search-container, .back-to-top, .reading-progress { display: none !important; }
        .post-content { font-size: 100% !important; }
      </style>
    </noscript>

    <!-- highlight.js (deferred to avoid render-blocking; only on pages with code) -->
    {% if page.code %}
    <script defer src="{{ '/js/highlightjs/highlight.min.js' | relative_url }}"></script>
    <script defer src="{{ '/js/highlightjs/languages/plaintext.min.js' | relative_url }}"></script>
    <script defer src="{{ '/js/highlightjs/languages/powershell.min.js' | relative_url }}"></script>
    <script defer src="{{ '/js/highlightjs/languages/tsql.min.js' | relative_url }}"></script>
    <script defer>
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof hljs !== 'undefined') {
        hljs.configure({
          ignoreEscapeReplacements: true,
          throwUnescapedHTML: false
        });
        hljs.highlightAll();
      }
    });
    </script>
    {% endif %}

    <script>
    (function() {
      var header = document.querySelector('.site-header');
      if (!header) return;
      var lastScroll = 0;
      var ticking = false;
      window.addEventListener('scroll', function() {
        if (!ticking) {
          window.requestAnimationFrame(function() {
            var current = window.pageYOffset;
            if (current > 60) {
              if (current > lastScroll) {
                header.style.transform = 'translateY(-100%)';
              } else {
                header.style.transform = 'translateY(0)';
              }
            } else {
              header.style.transform = 'translateY(0)';
            }
            lastScroll = current;
            ticking = false;
          });
          ticking = true;
        }
      });
    })();
    </script>

  </body>

</html>
