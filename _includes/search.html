<div class="search-container" style="position:relative; max-width:500px; margin:0 auto 2em;">
  <div style="display:flex; align-items:center; background:rgba(255,255,255,0.05); border:1px solid #1e2024; border-radius:10px; padding:0.4em 0.4em 0.4em 1em; transition:border-color 0.2s;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" id="searchInput" placeholder="Search articles..." aria-label="Search articles" style="flex:1; background:none; border:none; color:#f0f0f0; font-size:0.9em; padding:0.6em 0.8em; outline:none;">
    <button id="searchClearBtn" onclick="clearSearch()" style="display:none; background:none; border:none; color:#71717a; cursor:pointer; padding:0.4em; font-size:1em;" aria-label="Clear search">&times;</button>
  </div>
  <div id="searchShareRow" style="display:none; margin-top:0.5em; text-align:right;">
    <button type="button" id="searchShareBtn" onclick="shareSearch()" style="background:rgba(59,130,246,0.1); border:1px solid rgba(59,130,246,0.35); color:#60a5fa; cursor:pointer; padding:0.35em 0.9em; border-radius:8px; font-size:0.8em;"><i class="fa-solid fa-link"></i> Copy search link</button>
    <span id="searchShareMsg" style="color:#4ade80; font-size:0.78em; margin-right:0.6em; display:none;">Link copied!</span>
    <span style="color:#555; font-size:0.72em; margin-right:0.8em;">Press <kbd style="background:#151515; border:1px solid #1e2024; border-radius:4px; padding:0.1em 0.4em; font-size:0.92em;">/</kbd> or <kbd style="background:#151515; border:1px solid #1e2024; border-radius:4px; padding:0.1em 0.4em; font-size:0.92em;">Ctrl K</kbd> to search</span>
  </div>
  <div id="searchResults" role="listbox" aria-live="polite" aria-label="Search results" style="position:absolute; top:100%; left:0; right:0; background:#0a0a0a; border:1px solid #1e2024; border-radius:10px; margin-top:4px; max-height:400px; overflow-y:auto; display:none; z-index:1000; box-shadow:0 8px 32px rgba(0,0,0,0.4);"></div>
</div>

<script>
(function() {
  var searchIndex = [];
  var posts = [
    {% for post in site.posts %}
    {
      "title": {{ post.title | jsonify }},
      "description": {{ post.description | default: '' | jsonify }},
      "url": "{{ post.url | relative_url }}",
      "date": "{{ post.date | date: '%b %d, %Y' }}",
      "tags": {{ post.tags | join: ', ' | jsonify }}
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];
  searchIndex = posts;

  var input = document.getElementById('searchInput');
  var results = document.getElementById('searchResults');
  var clearBtn = document.getElementById('searchClearBtn');
  var shareRow = document.getElementById('searchShareRow');
  var shareBtn = document.getElementById('searchShareBtn');
  var shareMsg = document.getElementById('searchShareMsg');
  var debounceTimer;

  if (!input) return;

  function fromQueryParam() {
    var params = new URLSearchParams(window.location.search);
    return params.get('q') || '';
  }

  input.addEventListener('input', function() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(performSearch, 200);
  });

  input.addEventListener('focus', function() {
    if (this.value.trim().length > 0) performSearch();
  });

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      clearSearch();
    }
  });

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.search-container')) {
      results.style.display = 'none';
    }
  });

  window.shareSearch = function() {
    var query = input.value.trim();
    if (!query) return;
    var url = window.location.origin + window.location.pathname + '?q=' + encodeURIComponent(query);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function() {
        shareMsg.style.display = 'inline';
        setTimeout(function() { shareMsg.style.display = 'none'; }, 2000);
      });
    }
    if (history.replaceState) {
      history.replaceState(null, '', '?q=' + encodeURIComponent(query));
    }
  };

  function performSearch() {
    var query = input.value.trim().toLowerCase();
    if (query.length < 1) {
      results.style.display = 'none';
      clearBtn.style.display = 'none';
      shareRow.style.display = 'none';
      return;
    }
    clearBtn.style.display = 'block';
    shareRow.style.display = 'block';

    var matches = searchIndex.filter(function(post) {
      return post.title.toLowerCase().includes(query) ||
             post.description.toLowerCase().includes(query) ||
             post.tags.toLowerCase().includes(query);
    }).slice(0, 8);

    if (matches.length === 0) {
      results.textContent = '';
      var noResults = document.createElement('div');
      noResults.style.cssText = 'padding:1em; color:#71717a; font-size:0.88em; text-align:center;';
      noResults.textContent = 'No articles found';
      results.appendChild(noResults);
      results.style.display = 'block';
      return;
    }

    results.textContent = '';
    matches.forEach(function(post) {
      var link = document.createElement('a');
      link.href = post.url;
      link.style.cssText = 'display:block; padding:0.8em 1em; border-bottom:1px solid #151515; text-decoration:none; transition:background 0.15s;';
      link.onmouseover = function() { this.style.background = 'rgba(59,130,246,0.06)'; };
      link.onmouseout = function() { this.style.background = 'transparent'; };
      link.onfocus = function() { this.style.background = 'rgba(59,130,246,0.1)'; };
      link.onblur = function() { this.style.background = 'transparent'; };

      var titleDiv = document.createElement('div');
      titleDiv.style.cssText = 'color:#f0f0f0; font-size:0.9em; font-weight:600; margin-bottom:0.15em;';
      var re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      var parts = post.title.split(re);
      parts.forEach(function(part) {
        if (re.test(part)) {
          re.lastIndex = 0;
          var strong = document.createElement('strong');
          strong.style.color = '#3b82f6';
          strong.textContent = part;
          titleDiv.appendChild(strong);
        } else {
          titleDiv.appendChild(document.createTextNode(part));
        }
      });
      link.appendChild(titleDiv);

      if (post.description) {
        var descDiv = document.createElement('div');
        descDiv.style.cssText = 'color:#71717a; font-size:0.78em; line-height:1.4;';
        descDiv.textContent = post.description.substring(0, 100);
        link.appendChild(descDiv);
      }

      var metaDiv = document.createElement('div');
      metaDiv.style.cssText = 'color:#555; font-size:0.72em; margin-top:0.3em;';
      metaDiv.textContent = post.date + ' \u00B7 ' + post.tags.substring(0, 60);
      link.appendChild(metaDiv);

      results.appendChild(link);
    });
    results.style.display = 'block';
  }

  window.clearSearch = function() {
    input.value = '';
    results.style.display = 'none';
    clearBtn.style.display = 'none';
    shareRow.style.display = 'none';
    input.focus();
  };

  var initialQuery = fromQueryParam();
  if (initialQuery) {
    input.value = initialQuery;
    var section = document.getElementById('searchSection');
    if (section) { section.style.display = 'block'; }
    input.focus();
    performSearch();
  }
})();
</script>
