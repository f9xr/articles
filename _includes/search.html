<div class="search-container">
  <div class="search-input-wrap">
    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" id="searchInput" class="search-input" placeholder="Search articles..." aria-label="Search articles">
    <button id="searchClearBtn" class="search-clear-btn" onclick="clearSearch()" aria-label="Clear search">&times;</button>
  </div>
  <div id="searchShareRow" class="search-share-row">
    <button type="button" id="searchShareBtn" onclick="shareSearch()" class="search-share-btn"><i class="fa-solid fa-link"></i> Copy link</button>
    <span id="searchShareMsg" class="search-share-msg">Copied!</span>
    <span class="search-hint">Press <kbd>/</kbd> or <kbd>Ctrl K</kbd> to search</span>
  </div>
  <div id="searchResults" class="search-results" role="listbox" aria-live="polite" aria-label="Search results"></div>
</div>

<script>
(function() {
  var searchIndex = [];
  var posts = [
    {% for post in site.posts %}
    {
      "title": {{ post.title | jsonify }},
      "description": {{ post.description | default: '' | jsonify }},
      "url": "{{ post.url | relative_url }}",
      "date": "{{ post.date | date: '%b %d, %Y' }}",
      "tags": {{ post.tags | join: ', ' | jsonify }}
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];
  searchIndex = posts;

  var input = document.getElementById('searchInput');
  var results = document.getElementById('searchResults');
  var clearBtn = document.getElementById('searchClearBtn');
  var shareRow = document.getElementById('searchShareRow');
  var shareMsg = document.getElementById('searchShareMsg');
  var debounceTimer;

  if (!input) return;

  function fromQueryParam() {
    var params = new URLSearchParams(window.location.search);
    return params.get('q') || '';
  }

  input.addEventListener('input', function() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(performSearch, 200);
  });

  input.addEventListener('focus', function() {
    if (this.value.trim().length > 0) performSearch();
  });

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      clearSearch();
    }
  });

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.search-container')) {
      results.style.display = 'none';
    }
  });

  window.shareSearch = function() {
    var query = input.value.trim();
    if (!query) return;
    var url = window.location.origin + window.location.pathname + '?q=' + encodeURIComponent(query);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function() {
        shareMsg.style.display = 'inline';
        setTimeout(function() { shareMsg.style.display = 'none'; }, 2000);
      });
    }
    if (history.replaceState) {
      history.replaceState(null, '', '?q=' + encodeURIComponent(query));
    }
  };

  function performSearch() {
    var query = input.value.trim().toLowerCase();
    if (query.length < 1) {
      results.style.display = 'none';
      clearBtn.style.display = 'none';
      shareRow.style.display = 'none';
      return;
    }
    clearBtn.style.display = 'flex';
    shareRow.style.display = 'flex';

    var matches = searchIndex.filter(function(post) {
      return post.title.toLowerCase().includes(query) ||
             post.description.toLowerCase().includes(query) ||
             post.tags.toLowerCase().includes(query);
    }).slice(0, 8);

    if (matches.length === 0) {
      results.innerHTML = '<div class="search-no-results"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span>No articles found</span></div>';
      results.style.display = 'block';
      return;
    }

    results.textContent = '';
    matches.forEach(function(post) {
      var link = document.createElement('a');
      link.href = post.url;
      link.className = 'search-result-item';
      link.setAttribute('role', 'option');

      var re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      var titleHtml = post.title.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(re, '<mark class="search-highlight">$1</mark>');

      var descHtml = '';
      if (post.description) {
        var desc = post.description.substring(0, 120).replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(re, '<mark class="search-highlight">$1</mark>');
        descHtml = '<div class="search-result-desc">' + desc + '</div>';
      }

      var tagHtml = post.tags ? '<span class="search-tag">' + post.tags.split(',')[0].trim() + '</span>' : '';

      link.innerHTML =
        '<div class="search-result-title">' + titleHtml + '</div>' +
        descHtml +
        '<div class="search-result-meta">' +
          '<span class="search-result-date">' + post.date + '</span>' +
          tagHtml +
        '</div>';

      results.appendChild(link);
    });
    results.style.display = 'block';
  }

  window.clearSearch = function() {
    input.value = '';
    results.style.display = 'none';
    clearBtn.style.display = 'none';
    shareRow.style.display = 'none';
    input.focus();
  };

  var initialQuery = fromQueryParam();
  if (initialQuery) {
    input.value = initialQuery;
    var section = document.getElementById('searchSection');
    if (section) { section.style.display = 'block'; }
    input.focus();
    performSearch();
  }
})();
</script>
