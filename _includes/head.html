
<!-- Site build date: {{ "now" | date: "%FT%T%z" }} -->
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
  <meta name="author" content="{{ site.author }}">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="language" content="{{ site.lang }}">
  <meta name="revisit-after" content="7 days">
  <meta name="rating" content="general">

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="https://f9xr.github.io/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="https://f9xr.github.io/assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://f9xr.github.io/assets/apple-touch-icon.png">
  <link rel="manifest" href="https://f9xr.github.io/assets/site.webmanifest">

  <!-- SEO (jekyll-seo-tag generates title, description, canonical, OG, and Twitter meta) -->
  {% seo %}

  <!-- Open Graph extras (jekyll-seo-tag does not generate these) -->
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:locale" content="{{ site.locale }}">
  <meta property="og:image" content="https://f9xr.github.io/assets/og-image.webp">
  <meta property="og:image:alt" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  {%- if page.date %}
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
  {%- endif %}
  {%- if page.last_modified_at %}
  <meta property="article:modified_time" content="{{ page.last_modified_at | date_to_xmlschema }}">
  {%- endif %}
  <meta property="article:author" content="{{ page.author | default: site.author }}">
  <meta property="article:section" content="{{ page.tags | first | default: 'Articles' }}">

  <!-- Hreflang -->
  <link rel="alternate" hreflang="{{ site.lang }}" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <link rel="alternate" hreflang="x-default" href="{{ page.url | replace:'index.html','' | absolute_url }}">

  <!-- Feeds -->
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }} — Atom Feed" href="{{ '/atom.xml' | absolute_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }} — RSS Feed" href="{{ '/feed.xml' | absolute_url }}">
  <link rel="alternate" type="application/feed+json" title="{{ site.title | escape }} — JSON Feed" href="{{ '/feed.json' | absolute_url }}">

  <!-- LLMs -->
  <link rel="alternate" type="text/plain" title="{{ site.title | escape }} — llms.txt" href="{{ '/llms.txt' | absolute_url }}">
  <link rel="alternate" type="text/plain" title="{{ site.title | escape }} — llms-full.txt" href="{{ '/llms-full.txt' | absolute_url }}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="stylesheet" type="text/css" href="/css/override.css">

  <!-- highlight.js styles (loaded in head for FOUC prevention) -->
  <link rel="stylesheet" href="/js/highlightjs/styles/github-dark.css">
  <link rel="stylesheet" href="/js/highlightjs/styles/ssms.css">

  {% if jekyll.environment == 'production' and site.google_analytics -%}
  <!-- Begin Google Analytics -->
  {% include google-analytics.html %}
  <!-- End Google Analytics -->
  {%- endif %}
</head>
